<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Live view</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #222; color: #eee; display: flex; flex-direction: column; height: 100vh }
  #bar { display: flex; gap: 6px; padding: 6px; align-items: center }
  #url { flex: 1; min-width: 0 }
  button, input { font: inherit; color: inherit; background: #333; border: 1px solid #555; border-radius: 4px; padding: 3px 8px }
  input:disabled { color: #999 }
  #tabs button.on { background: #555 }
  #drive { background: #e83; border-color: #e83; color: #111 }
  body.drive #drive { background: #333; border-color: #555; color: inherit }
  #screen { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: flex-start }
  #img { max-width: 100%; max-height: 100% }
  #kb { position: fixed; top: 0; left: 0; width: 1px; height: 1px; padding: 0; border: 0; opacity: 0; font-size: 16px }
  body.drive #img { box-shadow: 0 0 0 3px #e83 }
  #hud { border-top: 1px solid #444; background: #191919; font: 12px ui-monospace, monospace; color: #ccc; display: flex; flex-direction: column; flex-shrink: 0 }
  #hud[hidden] { display: none }
  #hud-bar { height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 8px; cursor: pointer; user-select: none }
  #hud-summary { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
  #hud-counts { color: #999; white-space: nowrap }
  #hud-toggle { font-size: 11px; padding: 1px 6px }
  #hud-list { height: 134px; overflow-y: auto; border-top: 1px solid #333; padding: 4px 8px; display: none }
  #hud.open #hud-list { display: block }
  .hud-row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 18px }
  .hud-row.write { color: #fb9 }
  .hud-row.blocked { color: #f77 }
  .hud-row.high { color: #f77; font-weight: 600 }
  .hud-row.live { color: #fa4 }
</style>
<div id="bar">
  <span id="tabs"></span>
  <input id="url" disabled>
  <button id="drive">Take control</button>
</div>
<div id="screen"><img id="img" alt=""></div>
<div id="hud" hidden>
  <div id="hud-bar">
    <span id="hud-summary">Activity</span>
    <span id="hud-counts"></span>
    <button id="hud-toggle" type="button">Expand</button>
  </div>
  <div id="hud-list"></div>
</div>
<input id="kb" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
<script type="module">
const $ = id => document.getElementById(id)
const img = $('img'), url = $('url'), tabs = $('tabs'), driveButton = $('drive'), kb = $('kb')
const hud = $('hud'), hudBar = $('hud-bar'), hudSummary = $('hud-summary'), hudCounts = $('hud-counts'), hudToggle = $('hud-toggle'), hudList = $('hud-list')
// ?drive starts the person in control, as for signing in; ?watch only watches, with no control to take.
const initialDrive = new URLSearchParams(location.search).has('drive')
let ws, nextId, pending, targets, current, session, meta, pinned = false, showGen = 0, driving = initialDrive, typed = ''

const send = (method, params = {}, sessionId) => new Promise(resolve => {
  const id = nextId++
  pending.set(id, resolve)
  ws.send(JSON.stringify({ id, method, params, sessionId }))
})

function connect() {
  nextId = 1, pending = new Map(), targets = new Map(), current = session = null, pinned = false, showGen++
  ws = new WebSocket(new URL(driving ? 'view/drive' : 'view/watch', location.href).href.replace(/^http/, 'ws'))
  ws.onopen = () => send('Target.setDiscoverTargets', { discover: true })
  ws.onclose = () => document.title = 'Live view (disconnected)'
  ws.onmessage = e => {
    const m = JSON.parse(e.data)
    if (m.id) return pending.get(m.id)?.(m.result), pending.delete(m.id)
    if (m.method === 'Target.targetCreated' || m.method === 'Target.targetInfoChanged') {
      const t = m.params.targetInfo
      if (t.type !== 'page') return
      const isNew = m.method === 'Target.targetCreated' && !targets.has(t.targetId)
      targets.set(t.targetId, t)
      if (!current || (isNew && !driving && !pinned)) show(t.targetId)
      render()
    }
    if (m.method === 'Target.targetDestroyed' && targets.delete(m.params.targetId)) {
      if (current === m.params.targetId) {
        current = null, pinned = false
        const next = [...targets.keys()].at(-1)
        if (next) show(next)
      }
      render()
    }
    if (m.method === 'Page.screencastFrame' && m.sessionId === session) {
      img.src = 'data:image/jpeg;base64,' + m.params.data
      meta = m.params.metadata
      send('Page.screencastFrameAck', { sessionId: m.params.sessionId }, session)
    }
  }
  document.body.classList.toggle('drive', driving)
  document.title = 'Live view (connecting)'
  driveButton.textContent = driving ? 'Give back control' : 'Take control'
  url.disabled = !driving
  syncHudVisibility()
}

async function show(targetId, tried = new Set()) {
  const gen = ++showGen
  const prev = session
  session = null
  if (prev) send('Target.detachFromTarget', { sessionId: prev })
  current = targetId
  render()
  const attached = await send('Target.attachToTarget', { targetId, flatten: true })
  if (gen !== showGen) {
    if (attached?.sessionId) send('Target.detachFromTarget', { sessionId: attached.sessionId })
    return
  }
  if (!attached?.sessionId) {
    if (current === targetId) {
      current = null
      tried.add(targetId)
      const next = [...targets.keys()].filter(id => !tried.has(id)).at(-1)
      if (next) return show(next, tried)
    }
    render()
    return
  }
  session = attached.sessionId
  await send('Page.startScreencast', { format: 'jpeg', quality: 70 }, session)
  if (gen !== showGen) return
  document.title = driving ? 'Live view (you have control)' : 'Live view (watching)'
  render()
}

function render() {
  const ids = [...targets.keys()], newest = ids.at(-1)
  tabs.replaceChildren(...[...targets.values()].map(t => {
    const b = document.createElement('button')
    b.textContent = (t.title || t.url).slice(0, 24)
    b.title = t.url
    b.className = t.targetId === current ? 'on' : ''
    b.onclick = () => { pinned = t.targetId !== newest; show(t.targetId) }
    return b
  }))
  if (document.activeElement !== url) url.value = targets.get(current)?.url ?? ''
}

// Polling Activity HUD (textContent-only, outside page DOM, suppressed on ?drive & live driving)
let hudCursor = 0, hudStopped = initialDrive, hudInFlight = false, hudTimer = null, hudOpen = false, hudItems = []

function formatHudEvent(ev) {
  const ts = typeof ev.t === 'string' && ev.t.length >= 19 ? ev.t.slice(11, 19) : ''
  if (ev.kind === 'cdp') return `${ts} [CDP${ev.severity === 'high' ? '!' : ''}] ${ev.detail || ev.method || ''}`
  const status = ev.status ? ` ${ev.status}` : ''
  const blk = ev.blocked ? ` BLOCKED(${ev.blocked})` : ''
  return `${ts} ${ev.method || 'HTTP'}${status}${blk} ${ev.detail || ''}`
}

function renderHud(data) {
  hud.hidden = driving || hudStopped
  if (data) {
    hudCounts.textContent = `writes: ${data.writeCount ?? 0} | blocked: ${data.blockedCount ?? 0}${data.dropped ? ` | dropped: ${data.dropped}` : ''}`
    if (Array.isArray(data.events) && data.events.length) {
      for (const ev of data.events) hudItems.push(ev)
      if (hudItems.length > 100) hudItems = hudItems.slice(-100)
    }
    const latest = hudItems.at(-1)
    hudSummary.textContent = data.live ? 'Live control active (paused)' : latest ? formatHudEvent(latest) : 'Activity (idle)'
    const rows = hudItems.slice(-50).reverse().map(ev => {
      const div = document.createElement('div')
      div.className = 'hud-row' + (ev.blocked ? ' blocked' : ev.severity === 'high' ? ' high' : ev.isWrite ? ' write' : '')
      div.textContent = formatHudEvent(ev)
      return div
    })
    hudList.replaceChildren(...rows)
  }
}

function scheduleHudPoll() {
  if (hudStopped || driving || hudTimer) return
  hudTimer = setTimeout(() => {
    hudTimer = null
    void pollHud()
  }, 2000)
}

async function pollHud() {
  if (hudStopped || driving || hudInFlight) return
  hudInFlight = true
  try {
    const res = await fetch(new URL(`view/activity?after=${hudCursor}`, location.href).href, { cache: 'no-store' })
    if (res.status === 404 || res.status === 401 || res.status === 403) {
      hudStopped = true
      hud.hidden = true
      return
    }
    if (res.ok) {
      const data = await res.json()
      if (typeof data.nextCursor === 'number') hudCursor = data.nextCursor
      renderHud(data)
    }
  } catch {
  } finally {
    hudInFlight = false
    if (!hudStopped && !driving) scheduleHudPoll()
  }
}

function syncHudVisibility() {
  if (driving || hudStopped) {
    hud.hidden = true
    if (hudTimer) { clearTimeout(hudTimer); hudTimer = null }
  } else {
    void pollHud()
  }
}

hudBar.onclick = () => {
  hudOpen = !hudOpen
  hud.classList.toggle('open', hudOpen)
  hudToggle.textContent = hudOpen ? 'Collapse' : 'Expand'
}

const mods = e => (e.altKey ? 1 : 0) | (e.ctrlKey ? 2 : 0) | (e.metaKey ? 4 : 0) | (e.shiftKey ? 8 : 0)
const point = e => {
  const r = img.getBoundingClientRect()
  return { x: (e.clientX - r.left) * meta.deviceWidth / r.width, y: (e.clientY - r.top) * meta.deviceHeight / r.height }
}
const mouse = (type, e) => driving && session && meta && send('Input.dispatchMouseEvent', {
  type, ...point(e), modifiers: mods(e), buttons: e.buttons, clickCount: type === 'mouseMoved' ? 0 : e.detail || 1,
  button: type === 'mouseMoved' ? (e.buttons & 1 ? 'left' : 'none') : ['left', 'middle', 'right'][e.button],
}, session)
// Keys go through a hidden input: a phone shows its keyboard only for one, and that keyboard's text arrives as input events, not keys.
img.onmousedown = e => { if (driving) kb.value = typed = '', kb.focus(); mouse('mousePressed', e); e.preventDefault() }
img.onmouseup = e => mouse('mouseReleased', e)
img.onmousemove = e => mouse('mouseMoved', e)
img.oncontextmenu = e => e.preventDefault()
img.onwheel = e => {
  if (!driving || !session || !meta) return
  e.preventDefault()
  send('Input.dispatchMouseEvent', { type: 'mouseWheel', ...point(e), deltaX: e.deltaX, deltaY: e.deltaY, modifiers: mods(e) }, session)
}
kb.onkeydown = e => {
  if (!driving || !session || e.keyCode === 229 || ((e.ctrlKey || e.metaKey) && e.key === 'v')) return
  e.preventDefault()
  const text = e.key === 'Enter' ? '\r' : e.key.length === 1 && !e.ctrlKey && !e.metaKey ? e.key : undefined
  send('Input.dispatchKeyEvent', { type: text ? 'keyDown' : 'rawKeyDown', key: e.key, code: e.code, text, unmodifiedText: text, windowsVirtualKeyCode: e.keyCode, modifiers: mods(e) }, session)
}
kb.onkeyup = e => {
  if (!driving || !session || e.keyCode === 229) return
  e.preventDefault()
  send('Input.dispatchKeyEvent', { type: 'keyUp', key: e.key, code: e.code, windowsVirtualKeyCode: e.keyCode, modifiers: mods(e) }, session)
}
kb.oninput = () => {
  if (!driving || !session) return
  let same = 0
  while (same < typed.length && typed[same] === kb.value[same]) same++
  for (let i = same; i < typed.length; i++)
    for (const type of ['rawKeyDown', 'keyUp']) send('Input.dispatchKeyEvent', { type, key: 'Backspace', code: 'Backspace', windowsVirtualKeyCode: 8 }, session)
  if (kb.value.length > same) send('Input.insertText', { text: kb.value.slice(same) }, session)
  typed = kb.value
}
url.onkeydown = e => {
  if (e.key !== 'Enter') return
  send('Page.navigate', { url: /^\w+:/.test(url.value) ? url.value : 'https://' + url.value }, session)
  kb.focus()
}
driveButton.onclick = () => {
  driving = !driving
  kb.blur()
  ws.onclose = null
  ws.close()
  connect()
}
driveButton.hidden = new URLSearchParams(location.search).has('watch')
connect()
</script>
